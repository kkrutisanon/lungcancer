<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
</head>

<body class="bg-primary">
    {% include 'navbar.html' %}


    <div class="container-fluid bg-white p-4">
        <h3 class="text-center fw-semibold">Person Profile</h3>
        <hr>
        <div class="row p-4">
            {% for item in profile %}
            <div class="col-md-4">
                <p class="fs-5">
                    {{ item }}
                </p>
            </div>
            {% endfor %}

        </div>
    </div>

    <div class="container shadow p-4 mt-4">
        <h3 class="text-center text-white">Prediction</h3>
        <hr class="border-white border-opacity-75">
        <p class="fs-5 text-white">
            {{ output }}
        </p>
    </div>


    {% include 'footer.html' %}

</body>

</html>
